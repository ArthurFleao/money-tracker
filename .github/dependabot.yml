version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Held back on purpose — see docs/adr/0001-tech-stack.md before lifting.
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # eslint-plugin-jsx-a11y does not support ESLint 10 yet.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      # Tracks the Node LTS line pinned in .nvmrc.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
