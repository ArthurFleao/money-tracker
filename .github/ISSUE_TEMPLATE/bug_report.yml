name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste real financial data, API keys or tokens.**
        Security vulnerabilities must be reported privately — see docs/SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / OS / device
      placeholder: e.g. Chrome 140 on Windows 11, Safari on iPhone 16
  - type: dropdown
    id: adapter
    attributes:
      label: Data mode
      options:
        - Local (default)
        - Demo
        - Cloud (Firebase)
        - Not sure
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / logs
      description: Redact any personal amounts or names.
