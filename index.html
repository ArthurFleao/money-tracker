<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Money Tracker — see what you have, what is coming, and where you are headed."
    />
    <title>Money Tracker</title>
    <script>
      // Apply the stored theme before first paint to avoid a light/dark flash.
      // Must stay in sync with src/shared/theme (THEME_STORAGE_KEY, persisted
      // Zustand shape `{ state: { preference } }`, resolveTheme).
      (function () {
        try {
          var raw = localStorage.getItem('money-tracker:theme');
          var preference = raw ? JSON.parse(raw).state.preference : null;
          var dark =
            preference === 'dark' ||
            (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
